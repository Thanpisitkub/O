modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Origins (Forge port) and the libraries it needs. Version ranges are the same lower bounds that
# Origins itself declares for Apoli/Calio; the tested set is Origins 1.20.1-1.10.0.9,
# Apoli 1.20.1-2.9.0.8 and Calio 1.20.1-1.11.0.5.
[[dependencies.${mod_id}]]
    modId="origins"
    mandatory=true
    versionRange="[1.20.1-1.10,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="apoli"
    mandatory=true
    versionRange="[1.20.1-2.9,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="calio"
    mandatory=true
    versionRange="[1.20.1-1.11,)"
    ordering="AFTER"
    side="BOTH"

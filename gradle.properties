# Memory for Gradle (needed for the Minecraft decompilation step).
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties

# Minecraft / Forge used to COMPILE. The built jar runs on any Forge 47.x for Minecraft 1.20.1.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.0
forge_version_range=[47,)
loader_version_range=[47,)
# Official Mojang mappings.
mapping_channel=official
mapping_version=1.20.1


## Mod Properties

mod_id=painorigin
mod_name=Deva Path - Six Paths of Pain (Origin)
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.painorigin
mod_authors=Pain Origin contributors
mod_description=An Origins origin inspired by Pain's Deva Path: Shinra Tensei, Bansho Ten'in, Chibaku Tensei, Rinnegan Gravity Field and Universal Defense. Powers are data-driven (Origins/Apoli JSON); this jar adds the particles, sounds, commands and the phased Chibaku Tensei.
